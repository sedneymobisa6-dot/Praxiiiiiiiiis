<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Praxis Logo Concepts</title>
<style>
  body {
    background-color: #1A1A1A;
    color: #F5F3EF;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 60px;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .logo-box {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #111111;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .logo-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #8A8A8A;
    font-weight: 600;
  }
</style>
</head>
<body>

  <!-- CONCEPT 1: THE STARK (Sharp and Bold) -->
  <div class="logo-container">
    <div class="logo-box">
      <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Black Shield -->
        <path d="M50 8 L88 25 V65 C88 85 50 95 50 95 C50 95 12 85 12 65 V25 Z" fill="#000000" stroke="#F5F3EF" stroke-width="2"/>
        <!-- Superhero P (Beige) -->
        <path d="M35 72 V32 H62 C74 32 74 55 62 55 H45 V72 Z" fill="#F5F3EF" />
      </svg>
    </div>
    <div class="logo-title">Concept 1: The Stark</div>
  </div>

  <!-- CONCEPT 2: THE SLANT (Forward Momentum) -->
  <div class="logo-container">
    <div class="logo-box">
      <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Black Shield -->
        <path d="M50 5 L90 22 V65 C90 85 50 95 50 95 C50 95 10 85 10 65 V22 Z" fill="#000000" />
        <!-- Dynamic Slanted P (Beige) -->
        <path d="M36 74 L44 28 H68 C78 28 78 52 68 52 H48 L45 74 Z" fill="#F5F3EF" />
      </svg>
    </div>
    <div class="logo-title">Concept 2: The Slant</div>
  </div>

  <!-- CONCEPT 3: THE CAPED CRUSADER (Emblem) -->
  <div class="logo-container">
    <div class="logo-box">
      <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Black Shield (Thicker, more modern) -->
        <path d="M50 5 L85 20 V60 C85 82 50 95 50 95 C50 95 15 82 15 60 V20 Z" fill="#000000"/>
        <!-- P with an aggressive cut -->
        <path d="M32 70 V30 H65 L70 35 V50 L60 58 H42 V70 Z" fill="#F5F3EF" />
      </svg>
    </div>
    <div class="logo-title">Concept 3: The Emblem</div>
  </div>

</body>
</html>
