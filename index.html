<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Praxis Logo Concepts</title>
<style>
  body {
    background-color: #0B0B0D;
    color: #F5F3EF;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 60px;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .logo-box {
    width: 120px;
    height: 120px;
    background-color: #0B0B0D;
    border: 1px solid rgba(245, 243, 239, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #8A8A8A;
  }
</style>
</head>
<body>

  <!-- CONCEPT 1: THE MONOGRAM -->
  <div class="logo-container">
    <div class="logo-box">
      <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 20 L80 20 L80 40 L50 40 L50 80 L20 80 Z" fill="#F5F3EF"/>
        <path d="M50 50 L80 50 L80 80 L50 80 Z" fill="#D7263D"/>
      </svg>
    </div>
    <div class="logo-title">Concept 1: The Monogram</div>
  </div>

  <!-- CONCEPT 2: THE PIPELINE -->
  <div class="logo-container">
    <div class="logo-box">
      <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 30 H50 L80 70" stroke="#F5F3EF" stroke-width="8" stroke-linejoin="miter"/>
        <path d="M20 50 H45 L65 70" stroke="#F5F3EF" stroke-width="8" stroke-linejoin="miter"/>
        <path d="M20 70 H30" stroke="#D7263D" stroke-width="8" stroke-linejoin="miter"/>
        <circle cx="80" cy="70" r="6" fill="#F5F3EF"/>
        <circle cx="65" cy="70" r="6" fill="#F5F3EF"/>
        <circle cx="30" cy="70" r="6" fill="#D7263D"/>
      </svg>
    </div>
    <div class="logo-title">Concept 2: The Pipeline</div>
  </div>

  <!-- CONCEPT 3: THE SHIELD EVOLUTION -->
  <div class="logo-container">
    <div class="logo-box">
      <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 L90 30 V60 C90 80 50 95 50 95 C50 95 10 80 10 60 V30 L50 10 Z" stroke="#F5F3EF" stroke-width="8" stroke-linejoin="miter"/>
        <path d="M50 35 V65" stroke="#D7263D" stroke-width="8" stroke-linecap="square"/>
      </svg>
    </div>
    <div class="logo-title">Concept 3: The Shield Evolution</div>
  </div>

</body>
</html>
